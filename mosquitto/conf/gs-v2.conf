# GS MQTT broker of Fleet-DT v2 (SPEC_v2.md Section 5): bridges to vessel 1 (10.10.0.11).
# Repeat the two connections per vessel i with address 10.10.0.(10+i) and prefix boat/b<i>/.
listener 1883 0.0.0.0
allow_anonymous true
set_tcp_nodelay true
max_packet_size 1048576
max_inflight_messages 0
max_queued_messages 100000
persistence false
log_type error
log_type warning
log_type notice

# control bridge (priority 262 / DSCP EF by system/nftables-fdt.nft on port 1883)
connection b1-ctl
address 10.10.0.11:1883
bridge_protocol_version mqttv311
cleansession true
keepalive_interval 10
restart_timeout 1 2
notifications true
notifications_local_only true
notification_topic fleet/bridge/b1-ctl/state
topic boat/b1/demand in 1
topic boat/b1/regulator in 0
topic boat/b1/levels out 1
topic boat/b1/goals out 1

# data bridge (modes fleetdt, b1, b3, b5, slotted, tdma); mqttv311: the plugin computes the PUBLISH
# length of MQTT 3.1.1 for the offsets of B
connection b1-data
address 10.10.0.11:1884
bridge_protocol_version mqttv311
cleansession true
keepalive_interval 10
restart_timeout 1 2
notifications true
notifications_local_only true
notification_topic fleet/bridge/b1-data/state
topic boat/b1/tx/# in 2

# --- baseline b2 instead of b1-data: one data bridge per class; "topic # in 2 <local> <remote>"
# subscribes to <remote># on the vessel and republishes <local><rest> at the GS, so the consumers of
# the GS keep boat/b1/tx/<name>.
