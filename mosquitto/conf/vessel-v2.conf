# MQTT broker of vessel 1 of Fleet-DT v2 (SPEC_v2.md Sections 5 and 6), mode fleetdt.
# 1883: local programs (sources) and the control bridge of the GS; 1884: data bridge of the GS only.
# The plugin finds the data-bridge socket by this listener port, so nothing else connects to 1884.
listener 1883
listener 1884
allow_anonymous true
set_tcp_nodelay true
max_packet_size 1048576
# PR9: no limit on the QoS 2 messages in flight and on the queued messages towards the data bridge
max_inflight_messages 0
max_queued_messages 0
persistence false
log_type error
log_type warning
log_type notice

plugin /opt/fleet-dt/lib/fdt_regulator.so
plugin_opt_dtp /etc/fleetdt/dtp_v2.json
plugin_opt_vessel 1
# fleetdt (default) | b1 | b3 | b5 | slotted | tdma; b2: see vessel-v2-b2.conf
plugin_opt_mode fleetdt
plugin_opt_data_ports 1884
plugin_opt_stats_s 10
