# MQTT broker of vessel 1 of Fleet-DT v2, baseline b2 (forward at once, DSCP per class).
# One TCP connection carries one DSCP for every packet, so b2 uses one data bridge per class, each on
# its own listener: 1884 BE (output topics, e.g. video), 1885 AF41 (telemetry streams), 1886 EF
# (topics of R, e.g. state). The plugin republishes topic <name> on boat/b1/tx2/<class>/<name>;
# system/nftables-fdt.nft marks ports 1885 and 1886 with AF41 and EF; the GS bridges map the topics
# back to boat/b1/tx/<name> (gs-v2.conf, connections b1-data-be, b1-data-af41, b1-data-ef).
listener 1883
listener 1884
listener 1885
listener 1886
allow_anonymous true
set_tcp_nodelay true
max_packet_size 1048576
max_inflight_messages 0
max_queued_messages 0
persistence false
log_type error
log_type warning
log_type notice

plugin /opt/fleet-dt/lib/fdt_regulator.so
plugin_opt_dtp /etc/fleetdt/dtp_v2.json
plugin_opt_vessel 1
plugin_opt_mode b2
# order: BE, AF41, EF
plugin_opt_data_ports 1884,1885,1886
plugin_opt_stats_s 10
