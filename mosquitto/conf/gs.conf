# GS MQTT broker of Fleet-DT, generated by python -m fleetdt.gsconf gs
listener 1883 0.0.0.0
allow_anonymous true
set_tcp_nodelay true
max_packet_size 1048576
max_inflight_messages 65534
max_queued_messages 100000
persistence false
log_type error
log_type warning
log_type notice

connection b1-ctl
address 192.168.1.99:1883
bridge_protocol_version mqttv311
cleansession true
keepalive_interval 10
restart_timeout 1 2
notifications true
notifications_local_only true
notification_topic fleet/bridge/b1-ctl/state
topic boat/b1/demand in 1
topic boat/b1/regulator in 0
topic boat/b1/levels out 1
topic boat/b1/goals out 1

connection b1-data
address 192.168.1.99:1884
bridge_protocol_version mqttv311
cleansession true
keepalive_interval 10
restart_timeout 1 2
notifications true
notifications_local_only true
notification_topic fleet/bridge/b1-data/state
topic boat/b1/tx/# in 1

connection b2-ctl
address 192.168.1.98:1883
bridge_protocol_version mqttv311
cleansession true
keepalive_interval 10
restart_timeout 1 2
notifications true
notifications_local_only true
notification_topic fleet/bridge/b2-ctl/state
topic boat/b2/demand in 1
topic boat/b2/regulator in 0
topic boat/b2/levels out 1
topic boat/b2/goals out 1

connection b2-data
address 192.168.1.98:1884
bridge_protocol_version mqttv311
cleansession true
keepalive_interval 10
restart_timeout 1 2
notifications true
notifications_local_only true
notification_topic fleet/bridge/b2-data/state
topic boat/b2/tx/# in 1
