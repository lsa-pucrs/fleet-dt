# MQTT broker of vessel 1 of Fleet-DT, generated by python -m fleetdt.gsconf vessel
# 1883: local programs and the control bridge of the GS; 1884: data bridge of the GS only
listener 1883
listener 1884
allow_anonymous true
set_tcp_nodelay true
max_packet_size 1048576
max_inflight_messages 65534
max_queued_messages 100000
persistence false
log_type error
log_type warning
log_type notice

plugin /opt/fleet-dt/lib/fdt_regulator.so
plugin_opt_dtp /etc/fleetdt/dtp.json
plugin_opt_vessel 1
plugin_opt_data_port 1884
plugin_opt_stats_s 10
