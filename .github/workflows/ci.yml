name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build library with -Werror (BLOCKING)
        run: make lib
      - name: Run host unit tests (BLOCKING)
        run: make test
      - name: Build examples (BLOCKING)
        run: make examples
      - name: Type-check the SDK adapters against stubs (BLOCKING)
        run: make syntax
      - name: Run benchmarks and produce results/ (BLOCKING)
        run: make bench
      - name: Claim coverage and results assembly (BLOCKING)
        run: make report
      - name: Upload measurement artefacts
        uses: actions/upload-artifact@v4
        with:
          name: fleet-dt-results
          path: results/
