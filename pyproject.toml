[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetdt"
version = "2.0.0"
description = "Fleet-DT: network digital twin with dynamic bandwidth allocation for fleets of USVs (GS side)"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["paho-mqtt>=2.0", "aiohttp>=3.9", "numpy>=1.21", "scipy>=1.7"]

[project.scripts]
fleetdt-as = "fleetdt.as_service:main"
fleetdt-ve = "fleetdt.ve.__main__:main"
fleetdt-outer = "fleetdt.outer:main"
fleetdt-analysis = "fleetdt.analysis:main"
fleetdt-gsconf = "fleetdt.gsconf:main"

[tool.setuptools]
packages = ["fleetdt", "fleetdt.ve"]

[tool.setuptools.package-data]
"fleetdt.ve" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
