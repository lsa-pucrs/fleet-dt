# Fleet-DT, GS PC: time server of the fleet network (R4). The GS keeps its own clock when
# the field site has no Internet; the vessels and the radios follow it.
local stratum 8 orphan
allow 192.168.1.0/24
# no step of the clock during an operation: the AS and the VE run on the GS clock
makestep 1.0 3
