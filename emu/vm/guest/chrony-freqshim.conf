# systemd drop-in of chrony.service (installed as /etc/systemd/system/chrony.service.d/fdt-freqshim.conf):
# chronyd runs with fdt-freqshim.so, so the oscillator error of fdt-clockerr.py acts below chronyd
[Service]
Environment=LD_PRELOAD=/usr/local/lib/fdt/fdt-freqshim.so
Environment=FDT_FREQ_SHM=/run/fdt-clock/freq.shm
