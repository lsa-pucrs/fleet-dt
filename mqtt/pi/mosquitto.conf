# Mosquitto on the boat s Raspberry Pi (peer-to-peer MQTT test).
# The station connects to THIS broker across the link; everything the boat
# publishes lives here. Start: mosquitto -c mqtt/pi/mosquitto.conf
#
# Two listeners, one port. Loopback carries the boat-local publishers
# (publisher.py and zed_publisher.py both default to --broker localhost).
# 10.10.30.102 is eth0, behind the Bullet M2: the only address the station
# can reach. wlan0 (192.168.2.137) is deliberately absent, so mission traffic
# cannot silently ride WiFi.
listener 1883 127.0.0.1
listener 1883 10.10.30.102

allow_anonymous true

# MJPEG frames ride the broker: ~100 KB at 720p, 1 MB gives 1080p headroom.
# mosquitto 1.5.7 (Buster) has no max_packet_size; that key is 2.x only and
# an unknown key is fatal at startup.
message_size_limit 1048576

max_queued_messages 1000
max_inflight_messages 20

persistence false
log_type warning
