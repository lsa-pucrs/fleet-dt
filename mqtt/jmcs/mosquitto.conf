# Mosquitto on the station (peer-to-peer MQTT test).
# The test's boat topics live on the BOAT's broker; this one exists for
# station-local traffic and for a future bridged topology (add a
# `connection` block bridging boat/# both ways to compare topologies).
# Start: mosquitto -c mqtt/jmcs/mosquitto.conf

listener 1883
allow_anonymous true

max_packet_size 1048576
max_queued_messages 1000
max_inflight_messages 20

persistence false
log_type warning
