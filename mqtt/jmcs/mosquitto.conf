# Mosquitto on the ground station (cassio-server), bridged to the boat.
# The boat's broker (mqtt/pi/mosquitto.conf) owns the boat topics; this broker
# gives station-side clients a local copy and carries commands down. The
# station opens the bridge outbound, so the station picks the interface and
# the boat needs no route back.
# Start: mosquitto -c mqtt/jmcs/mosquitto.conf

# Station-local clients only. Boat traffic arrives through the bridge.
listener 1883 127.0.0.1
allow_anonymous true

message_size_limit 1048576
max_queued_messages 1000
max_inflight_messages 20

persistence false
log_type warning
log_type notice

# Bridge to boat b1 over the Bullet M2 link (Pi eth0 is static 192.168.1.99).
# The boat runs mosquitto 1.5.7, so MQTT 3.1.1. try_private (the default)
# marks this as a bridge, so the boat does not echo cmd/ping back to us.
connection boat-b1
address 192.168.1.99:1883
bridge_protocol_version mqttv311
cleansession true
keepalive_interval 10
restart_timeout 2 10
notifications true
notifications_local_only true
notification_topic fleet/bridge/boat-b1/state
# Telemetry and the retained zed/info come up at QoS 0: a late sample is
# worth less than the next one, and the boat publishes at QoS 0 anyway.
topic boat/b1/# in 0
# Commands go down at QoS 1: at least once, acknowledged hop by hop.
topic boat/b1/cmd out 1
topic boat/b1/ping out 0
