# Local broker aboard a Jundia boat.
#
# Section III: "local MQTT brokers are connected in bridge mode to avoid
# service interruption during temporary connection instability."
#
# The bridge is what makes that true. Telemetry published here is accepted and
# persisted by the local broker whether or not the Wi-Fi link to the ground
# station is up; when the link returns, the bridge reconnects and drains the
# backlog. A client publishing straight to the ground station would instead
# fail, and the frames produced during the outage would be lost.

listener 1883
allow_anonymous true

# Persistence is not optional here. Without it the queued messages live only
# in memory, and the outage the bridge exists to survive would take them.
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 30

connection ground
address ground.local:1883

# Telemetry goes up, goals come down. Two directions, two rules: a single
# bidirectional rule would loop a goal back to the ground station as if the
# boat had issued it.
topic fleet/# out 1 "" ""
topic fleet/+/goal in 1 "" ""

bridge_protocol_version mqttv50

# A clean session would drop the queue on reconnect, which is precisely the
# moment the queue matters.
cleansession false

# try_private tells the remote broker this is a bridge, so it does not echo
# messages back down the same connection.
try_private true

notifications true
restart_timeout 5
