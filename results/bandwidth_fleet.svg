<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-label="Link occupancy against fleet size">
<style>
  .bg{fill:#ffffff}
  .frame{stroke:#94a3b8;stroke-width:1;fill:none}
  .grid{stroke:#e2e8f0;stroke-width:1}
  .tick{fill:#475569;font:11px sans-serif}
  .axis{fill:#334155;font:12px sans-serif}
  .title{fill:#0f172a;font:bold 15px sans-serif}
  .rule{stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 4}
  .rulelab{fill:#475569;font:italic 11px sans-serif}
  .legend{fill:#334155;font:12px sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0b1120}
    .frame{stroke:#475569}
    .grid{stroke:#1e293b}
    .tick{fill:#94a3b8}
    .axis{fill:#cbd5e1}
    .title{fill:#f1f5f9}
    .rule{stroke:#94a3b8}
    .rulelab{fill:#94a3b8}
    .legend{fill:#cbd5e1}
  }
</style>
<rect class="bg" x="0" y="0" width="860" height="420"/>
<text class="title" x="72.0" y="28">Link occupancy against fleet size</text>
<line class="grid" x1="72.0" y1="307.0" x2="670.0" y2="307.0"/>
<text class="tick" x="64.0" y="311.0" text-anchor="end">0</text>
<line class="grid" x1="72.0" y1="205.0" x2="670.0" y2="205.0"/>
<text class="tick" x="64.0" y="209.0" text-anchor="end">100</text>
<line class="grid" x1="72.0" y1="103.0" x2="670.0" y2="103.0"/>
<text class="tick" x="64.0" y="107.0" text-anchor="end">200</text>
<line class="grid" x1="131.8" y1="52.0" x2="131.8" y2="358.0"/>
<text class="tick" x="131.8" y="376.0" text-anchor="middle">10</text>
<line class="grid" x1="231.5" y1="52.0" x2="231.5" y2="358.0"/>
<text class="tick" x="231.5" y="376.0" text-anchor="middle">20</text>
<line class="grid" x1="331.1" y1="52.0" x2="331.1" y2="358.0"/>
<text class="tick" x="331.1" y="376.0" text-anchor="middle">30</text>
<line class="grid" x1="430.8" y1="52.0" x2="430.8" y2="358.0"/>
<text class="tick" x="430.8" y="376.0" text-anchor="middle">40</text>
<line class="grid" x1="530.5" y1="52.0" x2="530.5" y2="358.0"/>
<text class="tick" x="530.5" y="376.0" text-anchor="middle">50</text>
<line class="grid" x1="630.1" y1="52.0" x2="630.1" y2="358.0"/>
<text class="tick" x="630.1" y="376.0" text-anchor="middle">60</text>
<rect class="frame" x="72.0" y="52.0" width="598.0" height="306.0"/>
<text class="axis" x="371.0" y="402.0" text-anchor="middle">vessels in the fleet</text>
<text class="axis" x="22.0" y="205.0" text-anchor="middle" transform="rotate(-90 22.0 205.0)">occupancy (%)</text>
<line class="rule" x1="72.0" y1="205.0" x2="670.0" y2="205.0"/>
<text class="rulelab" x="664.0" y="199.0" text-anchor="end">link saturated</text>
<line class="rule" x1="72.0" y1="306.0" x2="670.0" y2="306.0"/>
<text class="rulelab" x="664.0" y="300.0" text-anchor="end">1 % (Sec. V-A, reading A)</text>
<polyline fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" points="72.00,294.17 111.87,281.33 151.73,268.50 191.60,255.66 231.47,242.83 271.33,229.99 311.20,217.16 351.07,204.32 390.93,191.49 430.80,178.65 470.67,165.82 510.53,152.99 550.40,140.15 590.27,127.32 630.13,114.48 670.00,101.65 "/>
<rect x="680.0" y="54.0" width="12" height="12" fill="#2563eb"/>
<text class="legend" x="698.0" y="64.0">48 KB at 8 Hz per vessel</text>
</svg>
