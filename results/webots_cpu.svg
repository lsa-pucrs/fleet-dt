<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-label="CPU cost of the simulation against vessel count">
<style>
  .bg{fill:#ffffff}
  .frame{stroke:#94a3b8;stroke-width:1;fill:none}
  .grid{stroke:#e2e8f0;stroke-width:1}
  .tick{fill:#475569;font:11px sans-serif}
  .axis{fill:#334155;font:12px sans-serif}
  .title{fill:#0f172a;font:bold 15px sans-serif}
  .rule{stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 4}
  .rulelab{fill:#475569;font:italic 11px sans-serif}
  .legend{fill:#334155;font:12px sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0b1120}
    .frame{stroke:#475569}
    .grid{stroke:#1e293b}
    .tick{fill:#94a3b8}
    .axis{fill:#cbd5e1}
    .title{fill:#f1f5f9}
    .rule{stroke:#94a3b8}
    .rulelab{fill:#94a3b8}
    .legend{fill:#cbd5e1}
  }
</style>
